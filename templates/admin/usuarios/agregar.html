{% include 'components/cabecera_admin.html' %}


<div class="container py-5">
    <div class="grimorio-form">


        <!-- ENCABEZADO -->
        <div class="form-header">
            <span class="form-icon">✦</span>
            <h1>Agregar usuario</h1>
            <p>
                Registra un nuevo usuario administrativo en El Grimorio
            </p>
        </div>

        <form action="/admin/usuarios/agregar" method="POST">
            <!-- INFORMACIÓN DEL USUARIO -->
            <div class="form-section">
                <h3>Información del usuario</h3>
                <div class="row g-4">
                    <!-- ROL -->
                    <div class="col-md-6">
                        <label>Rol</label>
                        <select name="txtIdRol" class="form-control grimorio-input" required>
                            <option value="">
                                Seleccione un rol
                            </option>
                            {% for rol in roles %}
                            {% if rol[1]|lower != 'administrador' %}
                            <option value="{{ rol[0] }}">
                                {{ rol[1] }}
                            </option>
                            {% endif %}
                            {% endfor %}
                        </select>
                    </div>

                    <!-- USUARIO -->
                    <div class="col-md-6">
                        <label>Nombre de usuario</label>
                        <input type="text" name="txtUsuario" class="form-control grimorio-input"
                            placeholder="Ej. administrador" required>
                    </div>

                    <!-- CONTRASEÑA -->
                    <div class="col-md-6">
                        <label>Contraseña</label>
                        <input type="password" name="txtContrasena" class="form-control grimorio-input"
                            placeholder="Ingrese una contraseña" required>
                    </div>

                    <!-- NOMBRE COMPLETO -->
                    <div class="col-md-6">
                        <label>Nombre completo</label>
                        <input type="text" name="txtNombreCompleto" class="form-control grimorio-input"
                            placeholder="Nombre completo del usuario" required>
                    </div>

                    <!-- CORREO -->
                    <div class="col-md-6">
                        <label>Correo electrónico</label>
                        <input type="email" name="txtCorreo" class="form-control grimorio-input"
                            placeholder="correo@ejemplo.com" required>
                    </div>

                    <!-- ESTADO -->
                    <div class="col-md-6">
                        <label>Estado</label>
                        <select name="txtEstado" class="form-control grimorio-input" required>
                            <option value="">
                                Seleccione un estado
                            </option>
                            <option value="1">
                                Activo
                            </option>
                            <option value="0">
                                Inactivo
                            </option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- BOTONES -->
            <div class="form-actions">
                <a href="/admin/usuarios" class="btn-cancelar">
                    Cancelar
                </a>
                <button type="submit" class="btn-guardar">
                    <iconify-icon icon="solar:user-plus-outline">
                    </iconify-icon>
                    Guardar usuario
                </button>
            </div>
        </form>
    </div>
</div>


{% include 'components/footer_admin.html' %}
